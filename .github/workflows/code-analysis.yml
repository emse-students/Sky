name: code-analysis

# =================================================================================================
# THE SECURITY PASS - A LIBRARY, CALLED FROM BOTH MOMENTS IT IS WANTED
#
# CALLED BY `ci-bun.yml` AND BY `scheduled.yml`, AND BY NOTHING ELSE. It used to carry its own
# `push`, `pull_request` and `schedule` triggers, which made it a separate row in the Actions list
# and, worse, put its verdict OUTSIDE the check a merge waits on: CodeQL, the secret scan and the
# quality gate all ran on every pull request and **could not block a single merge**. A red tick
# nothing enforces is worse than no tick, because it looks enforced.
#
# Since 2026-09-04 it is `workflow_call` only. `ci-bun.yml` calls it as a job feeding `CI passed`,
# so a live secret now stops the merge; `scheduled.yml` calls the same file nightly, which is the
# half a pull request cannot see - a new advisory lands against code nobody touched.
# =================================================================================================
on:
  workflow_call:
    inputs:
      # WHAT AN UNREACHABLE npm ADVISORY ENDPOINT COSTS, AND IT IS NOT THE SAME IN BOTH CALLERS.
      # `bun audit` exits 1 for a 503 exactly as it does for a real advisory, and on 2026-09-03 that
      # walled every merge in Canari behind a five-minute npm outage. A pull request must not be
      # stopped by an incident nobody here can fix; the nightly pass must, because that failure IS
      # the report that a tree has gone a day unaudited. `audit-dependencies.sh` carries the
      # classification, this input carries the policy.
      registry_outage_is_failure:
        description: 'Fail when the npm advisory endpoint never answers. `true` for the nightly pass, `false` for a pull request.'
        required: false
        default: false
        type: boolean

jobs:
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `javascript-typescript`, one name for the pair. `javascript, typescript` named the same
      # analysis twice - `typescript` is an ALIAS of `javascript` in CodeQL, never a second target.
      # The action tag follows the major (`@v4`) like the sibling repos rather than freezing on a
      # patch: it is a first-party GitHub action, and a frozen CodeQL is a CodeQL that stops
      # learning about new query packs.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended, security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          extra_args: --debug --only-verified

  # There is no lint job here. The one that used to sit at this spot was named "ESLint Security
  # Check" for a tool this repository no longer has, ran the same `bun run lint` that ci-bun.yml
  # already runs, and carried `continue-on-error: true` - so it re-linted the same code and threw
  # the verdict away. It also set `bun-version: latest`, two lines below a comment in ci-bun.yml
  # explaining why nothing here may do that. Removing it removes a duplicate, a lie in a job name
  # and the only unpinned toolchain in this repository at once. Lint is gated in ci-bun.yml.

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # SONAR_TOKEN est optionnel - configure dans GitHub secrets si SonarCloud est utilisé.
      # sonarcloud-github-action est DÉPRÉCIÉE et archivée ; sonarqube-scan-action la remplace pour
      # Cloud comme Server. Seule différence : SONAR_HOST_URL, que l'ancienne action codait en dur.
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # THE ADVISORY AUDIT - MISSING HERE UNTIL 2026-09-04, AND IN NO OTHER REPOSITORY
  #
  # Canari, MiGallery and the portal have all audited their dependencies for months; this file had
  # CodeQL, a secret scan and a quality gate, and nothing that asks whether a SHIPPED dependency has
  # since been found vulnerable. Those are different questions - CodeQL reads the code in this
  # repository, and an advisory is about code nobody here wrote. The gap was invisible because every
  # OTHER tick was green.
  #
  # It can fail on a morning nobody pushed anything. That is what it is for, and
  # `.github/dependabot.yml` opens the pull request that fixes it.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  dependencies:
    name: Check Dependencies Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      # THE INVARIANT THAT KEEPS DEPENDABOT ALIVE. Dependabot bundles bun 1.3.14 with
      # `MAX_SUPPORTED_LOCKFILE_VERSION = 1` (dependabot-core#15896) and answers
      # `DependencyFileNotSupported` to a `lockfileVersion: 2` lockfile - so a v2 lockfile means NO
      # dependency updates for this repository, and the symptom is an ABSENCE of pull requests,
      # which nobody notices. bun >= 1.4 writes v2 for a lockfile it creates from nothing, and
      # rewrites an existing v1 to v3 when the manifest holds NESTED `overrides`. Enforced here
      # rather than by pinning the toolchain, because `.bun-version` never governed a contributor's
      # own bun, and deleting bun.lock before reinstalling is all it takes.
      - name: Guard the bun lockfile version
        run: |
          set -uo pipefail
          bad=""
          while IFS= read -r lock; do
            v="$(grep -m1 -o '"lockfileVersion"[[:space:]]*:[[:space:]]*[0-9]*' "$lock" | grep -o '[0-9]*$')"
            echo "--- $lock: lockfileVersion=${v:-MISSING}"
            [ "$v" = "1" ] || bad="$bad $lock"
          done < <(git ls-files '*bun.lock')
          if [ -n "$bad" ]; then
            echo "::error::bun lockfile version must be 1 (Dependabot cannot read v2):$bad"
            exit 1
          fi

      # THROUGH `audit-dependencies.sh`, WHICH IS THE ONE PLACE THAT TELLS THE REGISTRY'S ANSWER
      # APART FROM ITS SILENCE. `|| [ "$?" -eq 2 ]` is where this caller's policy lands: a 2 means
      # npm never answered, which is not a verdict about this tree. The script turns that 2 into a 1
      # by itself when the input above says an unaudited tree is a failure - which is what the
      # nightly pass asks for, and a pull request does not.
      - name: Audit dependencies
        env:
          REGISTRY_OUTAGE_IS_FAILURE: ${{ inputs.registry_outage_is_failure }}
        run: |
          set -uo pipefail
          bun install --frozen-lockfile
          .github/scripts/audit-dependencies.sh . --audit-level=moderate || [ "$?" -eq 2 ]
