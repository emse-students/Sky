name: CI (Bun)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Callable, so the deploy workflow's dispatch path can PROVE the checks rather than restate their
  # steps. An auto-merge made by GITHUB_TOKEN raises no `push` event, so nothing runs this workflow
  # on the merge commit and `deploy.yml` has no `workflow_run` to listen for - see the comment on
  # its `verify` job.
  workflow_call:

jobs:
  build:
    name: Build / Test / Lint / Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `.github/scripts/` is the only code in this repository that MERGES things, so it is linted
      # rather than merely parsed, and before a merge rather than after one. The linter was run
      # against all four repositories carrying these scripts before this step existed - a gate
      # nobody ran is how a pipeline goes red for a reason nobody changed - and it named exactly
      # one thing, SC1091, the sourced file it cannot resolve through `$(dirname "$0")`; the
      # `source-path=SCRIPTDIR` directives beside each `.` answer it. `-x` makes it follow the
      # source. It was also proved able to fail: an unquoted `rm $f` spliced into the library came
      # back as SC2086.
      #
      # THE VERSION IS PINNED AND THE RUNNER'S OWN COPY IS IGNORED. `ubuntu-latest` ships a
      # shellcheck, but which one is the image's business and it moves without this repository
      # changing - a floating linter is the same defect as an unverified one, arriving later. The
      # digest is of the archive that produced the run described above, so CI lints with the binary
      # whose verdict was actually read.
      - name: Lint the CI scripts
        env:
          SHELLCHECK_VERSION: v0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -sSLf -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version
          "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" -x \
            .github/scripts/*.sh .github/scripts/lib/*.sh .github/scripts/tests/*.sh

      # `bun-version-file`, not `bun-version: latest`: a toolchain nobody DECLARES is whatever the
      # runner happened to have that morning, and a lockfile is written by a version.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      # `--frozen-lockfile`: CI must fail on a lockfile the manifest no longer justifies, not
      # silently resolve a new one.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `check` runs paraglide:compile and svelte-kit sync itself, so nothing needs to precede it.
      - name: Type check
        run: bun run check

      # oxvelte is a Rust binary published on no registry, built from the revision
      # scripts/install-oxvelte.sh pins. Without this cache the shim rebuilt it on EVERY run - a
      # couple of minutes of every pipeline, spent silently inside a step named "Lint". The key
      # names the revision, so it must move when OXVELTE_REV does.
      - name: Cache oxvelte build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/oxvelte
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: oxvelte-7196779a-${{ runner.os }}

      # No NODE_OPTIONS heap bump: that existed for eslint, and `lint` is oxlint + oxvelte,
      # two Rust binaries. The flag would only raise a limit nothing here reaches.
      - name: Lint code
        run: bun run lint

      # `format` is in package.json and was in nobody's pipeline, so three files drifted out of
      # shape without a single red run. Checking is cheap; the alternative is that the next
      # person's formatter rewrites files they never touched and buries their own change inside
      # the diff.
      - name: Check formatting
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Create .env file for tests
        run: |
          cat > .env << EOF
          # CI test environment
          ENABLE_DEV_ROUTES=true
          COOKIE_SECRET=ci-test-secret-not-for-production-use
          DATABASE_PATH=./data/sky.db
          AUTH_TRUSTED_HOST=true
          EOF

      # `test` is `vitest run` under Node deliberately: the suite is green there and has not been
      # re-measured under the Bun runtime. Do not collapse it without re-running it.
      - name: Run tests
        run: bun run test
        env:
          API_BASE_URL: http://localhost:3000

      # THE GATE THAT LETS `@sveltejs/adapter-node` BE UPGRADED WITHOUT A HUMAN.
      #
      # `bun run build` proves the adapter PRODUCED something. It does not prove the thing it
      # produced STARTS, and nothing else here ever ran `build/index.js` - so an adapter major that
      # changed how the server bootstraps, read its port, or mounted its handler would leave every
      # check green and fail on the first request in production. A build is not a boot.
      #
      # The database is initialised first because the server opens it at startup; `/api/health` is
      # the same route the production healthcheck uses, so this asks the deployed question.
      - name: Boot the packaged server
        run: |
          set -uo pipefail
          bun scripts/init-db.js

          PORT=3399 ORIGIN=http://localhost:3399 bun build/index.js > /tmp/boot.log 2>&1 &
          server=$!

          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3399/api/health)" = "200" ]; then
              echo "The packaged server booted and answered /api/health."
              kill "$server" 2>/dev/null
              exit 0
            fi
            sleep 1
          done

          echo "::error::The packaged server never answered /api/health."
          kill "$server" 2>/dev/null
          cat /tmp/boot.log
          exit 1

      - name: Package application
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bun run package

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: sky-package
          path: 'build/artifacts/*.tgz'
          retention-days: 30
