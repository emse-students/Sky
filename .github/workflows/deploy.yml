# =================================================================================================
# DEPLOY THIS REPOSITORY'S ONE ESTATE - A LIBRARY, CALLED ONLY BY `release.yml`
#
# NO TRIGGERS OF ITS OWN, AND NO ROW OF ITS OWN IN THE ACTIONS LIST, since 2026-09-04. It used to
# fire on `workflow_run` after the CI finished on `main`, which made every merge a deployment:
# production was whatever the last green pull request happened to be, and nobody chose it.
# **Nothing deploys on a push any more** - `release.yml` is the only caller, in every repository of
# the ecosystem.
#
# IT IS HANDED A COMMIT AND A VERSION rather than working them out. The caller has already put them
# through the gates; recomputing them here would be a second opinion about what is being shipped,
# and the two would drift the day one of them changed.
# =================================================================================================
name: Deploy

on:
  workflow_call:
    inputs:
      sha:
        description: 'The commit to build and ship. Resolved and gated by the caller.'
        required: true
        type: string
      version:
        description: 'The version being released, without a leading `v`. Becomes an image tag.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    # NO `if:` AT ALL, and that is the point of being a library. Every condition this job used to
    # carry was about which trigger had fired and whether some other run had gone green; a called
    # workflow runs because its caller decided it should, and the caller's gates are the condition.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The commit the caller gated, never `github.sha` - which on a `release` event is the tag
          # and on a dispatch is whatever the branch happens to be by then.
          ref: ${{ inputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/emse-students/sky
          # THREE TAGS, AND THE VERSION IS THE ONE THAT MATTERS. `latest` is what the deploy
          # pulls; the sha tag is how a running container is traced back to a tree; and `v<version>`
          # is how it is traced back to the RELEASE somebody published, which is the only one of
          # the three a human ever says out loud.
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ inputs.version }}
            type=sha,prefix=main-

      # `.bun-version` IS THE ONE PLACE THIS REPOSITORY NAMES A BUN VERSION, and until 2026-09-04
      # the Dockerfile named it a second time. Two copies of a version drift in one direction only:
      # `setup-bun` in CI reads the file, the image did not, so a tree could be tested on one bun
      # and shipped on another with nothing anywhere reporting the difference. Read once here; the
      # Dockerfile's ARG default is now only what a bare `docker build` falls back to.
      - name: The bun version the image is built on, read from the one file that names it
        id: bun
        run: echo "version=$(cat .bun-version)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUN_VERSION=${{ steps.bun.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    runs-on: self-hosted
    needs: build-image
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /home/mitv/Sky
      COMPOSE: docker compose -f /home/mitv/Sky/docker-compose.prod.yml --project-directory /home/mitv/Sky
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The commit the caller gated, never `github.sha` - which on a `release` event is the tag
          # and on a dispatch is whatever the branch happens to be by then.
          ref: ${{ inputs.sha }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Generate .env from secrets
        env:
          MICONNECT_CLIENT_ID: ${{ secrets.MICONNECT_CLIENT_ID }}
          MICONNECT_CLIENT_SECRET: ${{ secrets.MICONNECT_CLIENT_SECRET }}
          MICONNECT_BASE_URL: ${{ secrets.MICONNECT_BASE_URL }}
          SKY_ADMIN_SUBS: ${{ secrets.SKY_ADMIN_SUBS }}
          MIGALLERY_API_KEY: ${{ secrets.MIGALLERY_API_KEY }}
          MIGALLERY_API_URL: ${{ secrets.MIGALLERY_API_URL }}
          CANARI_API_KEY: ${{ secrets.CANARI_API_KEY }}
          CANARI_API_URL: ${{ secrets.CANARI_API_URL }}
          SKY_API_KEY: ${{ secrets.SKY_API_KEY }}
        run: |
          for v in MICONNECT_CLIENT_ID MICONNECT_CLIENT_SECRET MIGALLERY_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Secret GitHub manquant: $v"; exit 1; fi
          done
          mkdir -p "$DEPLOY_DIR"
          umask 077
          {
            printf 'MICONNECT_CLIENT_ID=%s\n' "$MICONNECT_CLIENT_ID"
            printf 'MICONNECT_CLIENT_SECRET=%s\n' "$MICONNECT_CLIENT_SECRET"
            printf 'MIGALLERY_API_KEY=%s\n' "$MIGALLERY_API_KEY"
            if [ -n "$MICONNECT_BASE_URL" ]; then printf 'MICONNECT_BASE_URL=%s\n' "$MICONNECT_BASE_URL"; fi
            if [ -n "$SKY_ADMIN_SUBS" ]; then printf 'SKY_ADMIN_SUBS=%s\n' "$SKY_ADMIN_SUBS"; fi
            if [ -n "$MIGALLERY_API_URL" ]; then printf 'MIGALLERY_API_URL=%s\n' "$MIGALLERY_API_URL"; fi
            if [ -n "$CANARI_API_KEY" ]; then printf 'CANARI_API_KEY=%s\n' "$CANARI_API_KEY"; fi
            if [ -n "$CANARI_API_URL" ]; then printf 'CANARI_API_URL=%s\n' "$CANARI_API_URL"; fi
            if [ -n "$SKY_API_KEY" ]; then printf 'SKY_API_KEY=%s\n' "$SKY_API_KEY"; fi
          } > "$DEPLOY_DIR/.env"

      - name: Sync deploy files
        run: |
          cp docker-compose.prod.yml "$DEPLOY_DIR/"
          mkdir -p "$DEPLOY_DIR/scripts"
          cp scripts/backup-offsite.sh scripts/restore-offsite.sh "$DEPLOY_DIR/scripts/"
          chmod +x "$DEPLOY_DIR/scripts/backup-offsite.sh" "$DEPLOY_DIR/scripts/restore-offsite.sh"

      - name: Pull image
        run: $COMPOSE pull

      - name: Deploy
        run: $COMPOSE up -d --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/health || true)
            if [ "$code" = "200" ]; then echo "✅ Sky healthy"; exit 0; fi
            sleep 3
          done
          echo "::error::Health check KO apres deploiement"
          $COMPOSE logs --tail 50
          exit 1

      - name: Cleanup Docker
        run: |
          docker image prune -af --filter 'until=24h' || true
          docker builder prune -af --filter 'until=168h' || true
