name: Deploy to production

on:
  workflow_run:
    workflows: ['CI (Bun)']
    types:
      - completed
    branches:
      - main
  # A HAND RE-DEPLOY, and since 2026-09-04 that is all it is. It used to be load-bearing: a merge
  # made by `GITHUB_TOKEN` raises no `push` event - GitHub's anti-recursion rule - so `CI (Bun)`
  # never ran on the merge commit, the trigger above never fired, and every dependency update sat
  # merged and undeployed until the hourly sweep dispatched this by hand. `arm-auto-merge.yml` arms
  # with an App token, whose merge DOES raise the push, so the ordinary path works and this is a
  # convenience again.
  workflow_dispatch:

jobs:
  # Under `workflow_run` the proof already exists: the trigger MEANS that CI (Bun) ran on this exact
  # commit and passed. Under `workflow_dispatch` nothing has run it - so it is run HERE, by calling
  # the same workflow rather than restating its steps, which is the only way the two paths cannot
  # drift apart.
  # A CALLED WORKFLOW CANNOT BE GRANTED MORE THAN ITS CALLER GRANTS IT, and exceeding that is a
  # STARTUP FAILURE - no job runs, no log is produced, and the API returns neither an annotation nor
  # an error message. `ci-bun.yml` now calls `code-analysis.yml`, whose CodeQL job asks for
  # `security-events: write`, so this job must grant it or a hand-dispatched deploy dies before its
  # first line. Derived from what the callees declare, not chosen here.
  verify:
    name: Verify
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/ci-bun.yml

  build-image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [verify]
    # `always()` because `verify` is SKIPPED on the workflow_run path, and a skipped dependency
    # would otherwise skip this job too. The two accepted states are named explicitly: verify
    # passed, or verify did not need to run because CI already had.
    if: >-
      always() &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Empty under workflow_dispatch, where `github.sha` is main's tip - the merge commit
          # the sweep just created, or a later one, either of which is the right thing to ship.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/emse-students/sky
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    runs-on: self-hosted
    needs: build-image
    # `needs: build-image` already carries the verify verdict; this only has to not run when the
    # image job did not.
    if: ${{ needs.build-image.result == 'success' }}
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /home/mitv/Sky
      COMPOSE: docker compose -f /home/mitv/Sky/docker-compose.prod.yml --project-directory /home/mitv/Sky
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Empty under workflow_dispatch, where `github.sha` is main's tip - the merge commit
          # the sweep just created, or a later one, either of which is the right thing to ship.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Generate .env from secrets
        env:
          MICONNECT_CLIENT_ID: ${{ secrets.MICONNECT_CLIENT_ID }}
          MICONNECT_CLIENT_SECRET: ${{ secrets.MICONNECT_CLIENT_SECRET }}
          MICONNECT_BASE_URL: ${{ secrets.MICONNECT_BASE_URL }}
          SKY_ADMIN_SUBS: ${{ secrets.SKY_ADMIN_SUBS }}
          MIGALLERY_API_KEY: ${{ secrets.MIGALLERY_API_KEY }}
          MIGALLERY_API_URL: ${{ secrets.MIGALLERY_API_URL }}
          CANARI_API_KEY: ${{ secrets.CANARI_API_KEY }}
          CANARI_API_URL: ${{ secrets.CANARI_API_URL }}
          SKY_API_KEY: ${{ secrets.SKY_API_KEY }}
        run: |
          for v in MICONNECT_CLIENT_ID MICONNECT_CLIENT_SECRET MIGALLERY_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Secret GitHub manquant: $v"; exit 1; fi
          done
          mkdir -p "$DEPLOY_DIR"
          umask 077
          {
            printf 'MICONNECT_CLIENT_ID=%s\n' "$MICONNECT_CLIENT_ID"
            printf 'MICONNECT_CLIENT_SECRET=%s\n' "$MICONNECT_CLIENT_SECRET"
            printf 'MIGALLERY_API_KEY=%s\n' "$MIGALLERY_API_KEY"
            if [ -n "$MICONNECT_BASE_URL" ]; then printf 'MICONNECT_BASE_URL=%s\n' "$MICONNECT_BASE_URL"; fi
            if [ -n "$SKY_ADMIN_SUBS" ]; then printf 'SKY_ADMIN_SUBS=%s\n' "$SKY_ADMIN_SUBS"; fi
            if [ -n "$MIGALLERY_API_URL" ]; then printf 'MIGALLERY_API_URL=%s\n' "$MIGALLERY_API_URL"; fi
            if [ -n "$CANARI_API_KEY" ]; then printf 'CANARI_API_KEY=%s\n' "$CANARI_API_KEY"; fi
            if [ -n "$CANARI_API_URL" ]; then printf 'CANARI_API_URL=%s\n' "$CANARI_API_URL"; fi
            if [ -n "$SKY_API_KEY" ]; then printf 'SKY_API_KEY=%s\n' "$SKY_API_KEY"; fi
          } > "$DEPLOY_DIR/.env"

      - name: Sync deploy files
        run: |
          cp docker-compose.prod.yml "$DEPLOY_DIR/"
          mkdir -p "$DEPLOY_DIR/scripts"
          cp scripts/backup-offsite.sh scripts/restore-offsite.sh "$DEPLOY_DIR/scripts/"
          chmod +x "$DEPLOY_DIR/scripts/backup-offsite.sh" "$DEPLOY_DIR/scripts/restore-offsite.sh"

      - name: Pull image
        run: $COMPOSE pull

      - name: Deploy
        run: $COMPOSE up -d --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/health || true)
            if [ "$code" = "200" ]; then echo "✅ Sky healthy"; exit 0; fi
            sleep 3
          done
          echo "::error::Health check KO apres deploiement"
          $COMPOSE logs --tail 50
          exit 1

      - name: Cleanup Docker
        run: |
          docker image prune -af --filter 'until=24h' || true
          docker builder prune -af --filter 'until=168h' || true
